seedream:
  api_url: ""
  model: "doubao-seedream-4-0-250828"
  size: "2K"
  response_format: "url"
  watermark: false
  sequential_image_generation: "disabled"
  stream: false

  request_timeout: 240
  download_timeout: 120

  # 上传前压缩，避免把超大原图直接塞进请求
  max_input_side: 2048
  jpeg_quality: 92

app:
  environment: "local"        # local / modelscope
  local_host: "127.0.0.1"
  modelscope_host: "0.0.0.0"
  port: 7860
  share: false
  output_dir: "outputs"

agent:
  default_mode: "2D人物优化"

  styles:
    "自然人像优化": |
      自然、专业的人像摄影质感。
      优化曝光、色彩、光影、皮肤质感和清晰度。
      保留真实皮肤纹理，不要过度磨皮，不改变人物身份。

    "电影感": |
      高级电影人物摄影风格。
      柔和而有层次的电影光线，自然景深，克制的色彩分级，
      保留真实人物质感和原人物身份。

    "二次元角色": |
      高质量日系动画角色设计。
      将人物转化为精致二次元角色，但保持脸型、五官关系、
      发型、年龄感、服装核心特征和人物身份可辨识度。

    "3D角色概念": |
      高质量3D角色概念设计图。
      清晰表达人物结构、人体比例、发型轮廓、服装结构和材质，
      画面干净，适合作为3D角色建模参考。

    "写实游戏角色": |
      AAA写实游戏角色概念设计风格。
      保持人物身份，强化皮肤、头发、服装材质和结构信息，
      适合作为数字人或游戏角色建模参考。

  portrait_base_prompt: |
    你是一名专业人物摄影师和角色设计师。
    请基于输入人物参考图进行图像编辑。

    【身份保持要求】
    - 输入图片中的人物是唯一身份参考。
    - 保持脸型、五官比例、眼睛、鼻子、嘴巴等身份特征。
    - 保持年龄感、主要发型特征和人物整体辨识度。
    - 不要把人物变成另一个人。
    - 除非用户明确要求，否则尽量保持姿态、服装和构图。

    【风格要求】
    {style_prompt}

    【用户额外要求】
    {instruction}

    输出一张高质量人物图像。不要添加无关文字、边框或水印元素。

  model_reference_base_prompt: |
    根据输入人物参考图，生成“同一个人物”的3D角色建模参考图。

    【当前视角】
    {view_name}

    【视角要求】
    {view_instruction}

    【严格一致性要求】
    - 人物身份必须与参考图一致。
    - 保持脸型、五官、年龄、发型、服装设计和主要颜色一致。
    - 保持人物体型和身体比例一致。
    - 不增加新的首饰、纹样、服装配件或其他角色设定。
    - 画面只出现一个人物。
    - 尽量采用中立、自然、稳定的姿态。
    - 背景使用纯白或浅灰摄影棚背景。
    - 使用均匀中性光，减少强烈阴影和戏剧化透视。
    - 目标是辅助 Blender / Maya / 3D角色建模，而不是艺术摄影。
    - 不添加文字、尺寸线、边框、标注或其他人物。

  views:
    "正面 Front": |
      严格正面视角。人物身体正对镜头，镜头高度自然，
      尽量减少透视夸张，清晰展示脸部、身体正面和服装正面结构。

    "右侧 Right": |
      严格90度右侧视角，不要使用3/4视角。
      清晰展示人物右侧脸部轮廓、头发侧面、身体和服装侧面结构。

    "背面 Back": |
      严格180度背面视角。
      人物背对镜头，清晰展示后脑、发型后部、肩背、服装背部和身体后侧结构。

    "左侧 Left": |
      严格90度左侧视角，不要使用3/4视角。
      清晰展示人物左侧脸部轮廓、头发侧面、身体和服装侧面结构。
